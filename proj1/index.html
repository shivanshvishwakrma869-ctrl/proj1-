<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="search">
            <input type="text" name="" id="" placeholder="Enter city name." spellcheck="false">
            <button><img src="images/icons8-search-50.png" alt="Search"></button>
        </div>
    

    <div class="weather">
        <img src="images/icons8-sun-32.png" alt="weather" class="weathericon">
        <span>
            <h1 class="temp"> 22</h1>
        </span>
        <h2 class="city">New York</h2>
    </div>
        <div class="details">
            <div class="col">
                <img src="images/icons8-humidity-48.png" alt="">
                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/icons8-wind-32.png" alt="">
                <div>
                    <p class="Wind">15 Kmph</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    
    
    <script src="app.js"></script>
</body>
</html>
